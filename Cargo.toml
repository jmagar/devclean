[workspace]
members = ["crates/devclean-core", "crates/devclean"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
blake3 = "1.8"
camino = { version = "1.2", features = ["serde1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
thiserror = "2.0"
uuid = { version = "1.18", features = ["v5", "serde"] }
tempfile = "3.23"
libc = "0.2"
socket2 = "0.6"
rayon = "1.11"
schemars = { version = "1.0", features = ["uuid1"] }
